line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".git",
    # WP-L5 (issue #134): deliberately-invalid Python fixture data, not a
    # lint target -- exercises PythonTreeSitterExtractor's partial-
    # extraction-on-syntax-error behavior.
    "ingestion_service/tests/fixtures/python_repo_syntax_error",
]
[lint]
select = ["E", "F", "W", "C"]

[lint.per-file-ignores]
# Long-line prose fixture: the chunker input is a single continued string
# literal whose line lengths are part of the test data (issue #28).
"ingestion_service/tests/core/chunkers/test_text_chunker.py" = ["E501"]
