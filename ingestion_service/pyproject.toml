[project]
name = "agentic-rag-ingestion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"  # Docling 2.70+ requires 3.10+

dependencies = [
    "alembic>=1.17.2",
    "fastapi>=0.125.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.3.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "python-multipart>=0.0.21",
    "sqlalchemy>=1.4,<2.0",
    "sqlalchemy-utils>=0.42.1",
    "uvicorn>=0.38.0",
    "requests>=2.32.5",
    "pillow>=12.0.0",
    "pytesseract>=0.3.13",
    "pymupdf>=1.22.5",
    "tree_sitter>=0.20.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "GitPython>=3.1.43",
    "markdown-it-py>=3.0.0",

    # ---- Docling + OCR ----
    "docling>=2.18.0,<3.0.0",
    "docling[ocrmac]; sys_platform == 'darwin'",

    # ---- Torch (CPU-only) ----
    "torch>=2.0.0; sys_platform != 'darwin'",
    "torch>=2.0.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision; sys_platform != 'darwin'",
    "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",

    "markitdown[all]>=0.1.0",
]


[project.optional-dependencies]
ui = [
    "gradio>=6.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pyright>=1.1.407",
    "ruff>=0.14.10",
]

# Without this, uv resolves the default CUDA-enabled torch wheel on Linux
# (~2GB of nvidia-*/triton packages) even though the container never runs on
# a GPU host. torchvision must be pinned to the same index — mixing a
# CPU-only torch with a PyPI-default torchvision breaks at import time
# (ABI mismatch: "operator torchvision::nms does not exist"). Scoped to
# non-darwin only so the existing macOS pins above are untouched.
# See issue #57 (mirrors the rag_orchestrator fix from #55).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
