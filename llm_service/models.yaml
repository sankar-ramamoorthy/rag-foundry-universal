# llm_service model registry (WP-M1, endpoints per issue #43).
#
# Friendly aliases -> LiteLLM model strings. Every string value supports
# ${VAR} / ${VAR:default} environment interpolation. This committed file
# is UNIVERSAL: it must work for anyone who clones the repo. Machine-
# specific inference endpoints (e.g. a Tailscale-reachable GPU box)
# declare their api_base as ${SOME_VAR:} — with the env var unset the
# entry simply doesn't exist; setting the var in your gitignored .env
# activates it. LLM_DEFAULT_ALIAS promotes any alias to the default
# route for this machine.
#
# Example personal .env for a remote Ollama default:
#   REMOTE_OLLAMA_BASE_URL=http://<tailscale-ip>:11434
#   REMOTE_OLLAMA_MODEL=Qwen3:4b
#   LLM_DEFAULT_ALIAS=remote
#
# Raw LiteLLM strings (containing "/") always pass through verbatim, and
# `<endpoint>/<model>` routes any model the user believes exists to that
# named endpoint.
#
# API keys are env-only (OPENAI_API_KEY, ANTHROPIC_API_KEY, GROQ_API_KEY,
# ...) — LiteLLM reads them natively. Never put keys or machine-specific
# addresses in this file.

models:
  # Windows/host-local Ollama — works out of the box for every clone.
  local:
    model: ollama/${OLLAMA_MODEL:phi4-mini:latest}
    # api_base omitted -> OLLAMA_BASE_URL (host.docker.internal)
  # Remote Ollama box — exists only when REMOTE_OLLAMA_BASE_URL is set.
  # Promote it to the default route with LLM_DEFAULT_ALIAS=remote.
  remote:
    model: ollama/${REMOTE_OLLAMA_MODEL:Qwen3:4b}
    api_base: ${REMOTE_OLLAMA_BASE_URL:}
    timeout: 300
  # Per-step model for /v1/summarize (small + fast is plenty). Exists
  # only alongside the remote endpoint; without it, summaries use the
  # default route.
  summarize:
    model: ollama/${SUMMARIZE_MODEL:granite4:350m}
    api_base: ${REMOTE_OLLAMA_BASE_URL:}
    timeout: 180
  fast: anthropic/claude-haiku-4-5
  smart: anthropic/claude-sonnet-5
  gpt: openai/gpt-5.1

  # issue #46: first-class Groq / NVIDIA NIM / OpenRouter. Raw LiteLLM
  # strings (e.g. "groq/llama-3.1-8b-instant") already pass through
  # verbatim without these entries -- these are committed convenience
  # aliases (listed in GET /v1/models, usable in the Gradio dropdown) so
  # a user doesn't have to know exact model-ID strings. Like fast/smart/
  # gpt above, these are always listed (no api_base to env-gate on) and
  # simply fail at call time if the matching API key isn't set --
  # GROQ_API_KEY / NVIDIA_API_KEY / OPENROUTER_API_KEY, env-only, read
  # natively by LiteLLM. Exact model IDs shift over time (verify against
  # each provider's current catalog, especially OpenRouter's free tier,
  # which rotates frequently) -- update this file, not code, when they do.
  groq_fast: groq/llama-3.1-8b-instant
  groq_smart: groq/llama-3.3-70b-versatile
  groq_reasoning: groq/openai/gpt-oss-120b
  nim_fast: nvidia_nim/meta/llama3-8b-instruct
  nim_smart: nvidia_nim/meta/llama3-70b-instruct
  # OpenRouter's free-tier roster rotates frequently -- verify this
  # slug still exists at openrouter.ai/models before relying on it.
  openrouter_free: openrouter/meta-llama/llama-3.3-70b-instruct:free
  # issue #147: Z.ai's free-tier GLM Flash models. Requires litellm's
  # first-class "zai" provider (present since litellm 1.93.0 -- verify
  # if pinning an older version) and ZAI_API_KEY, env-only like every
  # other credential in this file. Default api_base is Z.ai's standard
  # API endpoint (https://api.z.ai/api/paas/v4); a coding-plan account
  # needs a different endpoint and is not covered by this default.
  zai_flash_4_5: zai/glm-4.5-flash
  zai_flash_4_7: zai/glm-4.7-flash

# Named inference endpoints: `model=<name>/<anything>` routes that model
# string to the endpoint's api_base with its LiteLLM provider prefix.
# GET /v1/models lists these with a live model inventory when reachable.
# Entries with an unset api_base env var don't exist.
endpoints:
  tailscaleollamalinux:
    provider: ollama
    api_base: ${REMOTE_OLLAMA_BASE_URL:}
    timeout: 300
  windowsollamalocal:
    provider: ollama
    api_base: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
    timeout: 600
  # issue #46: NVIDIA NIM as a named endpoint -- `nvidia_nim/<any model>`
  # (e.g. nvidia_nim/meta/llama3-405b-instruct) routes to NVIDIA's hosted
  # catalog without pre-registering every model, same pattern as the
  # Ollama endpoints above. Unlike those, this one always exists (its
  # default api_base is NVIDIA's public endpoint, not a machine-specific
  # address) -- NVIDIA_NIM_API_BASE only needs setting for a self-hosted
  # NIM deployment.
  nvidia_nim:
    provider: nvidia_nim
    api_base: ${NVIDIA_NIM_API_BASE:https://integrate.api.nvidia.com/v1/}
    timeout: 120

# WP-M6: provider families that support dynamic model-catalog discovery
# (llm_service/src/core/model_catalog.py). This section stays deliberately
# minimal -- provider families and stable defaults only, never concrete
# discovered model IDs. The catalog itself is runtime state (fetched live,
# TTL-cached, advisory-only) and must never get written back into this
# committed file.
providers:
  groq:
    credential_env: GROQ_API_KEY
    catalog_url: https://api.groq.com/openai/v1/models
  openrouter:
    credential_env: OPENROUTER_API_KEY
    catalog_url: https://openrouter.ai/api/v1/models
  nvidia_nim:
    credential_env: NVIDIA_API_KEY
    catalog_url: ${NVIDIA_NIM_API_BASE:https://integrate.api.nvidia.com/v1/}models

# WP-M2 fallback chains. Keys may be aliases or endpoint names; targets
# are aliases, tried in order after the primary fails (2 retries each).
# `default: [local]` is harmless when default IS local (duplicates
# collapse) and gives remote-default machines automatic local fallback.
fallbacks:
  default: [local]
  remote: [local]
  summarize: [local]
  tailscaleollamalinux: [local]
  smart: [gpt, default]
  # issue #46: cloud aliases degrade to local instead of failing outright
  # when a key is missing/invalid or a provider has an outage.
  groq_fast: [local]
  groq_smart: [groq_fast, local]
  groq_reasoning: [groq_smart, groq_fast, local]
  nim_fast: [local]
  nim_smart: [nim_fast, local]
  openrouter_free: [local]
  # matches tailscaleollamalinux above: applies when a user picks
  # nvidia_nim/<any model> directly rather than the nim_fast/nim_smart
  # aliases.
  nvidia_nim: [local]
  # issue #147: degrade to local instead of failing outright when
  # ZAI_API_KEY is missing/invalid or Z.ai has an outage.
  zai_flash_4_5: [local]
  zai_flash_4_7: [local]

# Per-alias request timeout in seconds; `default` applies to everything
# without an explicit entry (falls back to LLM_TIMEOUT env, 120 s).
# 600 matches CPU-only local Ollama needs (verified live — 120 s made
# /generate time out); remote GPU entries use tighter per-alias values.
timeouts:
  default: 600
