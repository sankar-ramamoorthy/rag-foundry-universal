services:
  ######################
  # 🗃️ Database
  ######################
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ingestion-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ingestion_user
      POSTGRES_PASSWORD: ingestion_pass
      POSTGRES_DB: ingestion_db
    volumes:
      - ./volumes/ingestion-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion_user -d ingestion_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ragnet

  ######################
  # 🚀 RAG Services
  ######################
  ingestion_service:
    build:
      context: .
      dockerfile: ingestion_service/Dockerfile
    container_name: ingestion-service
    ports:
      - "8001:8000"
    volumes:
      - ./ingestion_service/src:/app/ingestion_service/src
      - ./shared:/app/shared
    #  - ./ingestion_service:/app/ingestion_service
    #  - ./shared:/app/shared
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://ingestion_user:ingestion_pass@postgres:5432/ingestion_db
      PYTHONPATH: /app:/app/src
      INGESTION_NODE_PAGE_SIZE: ${INGESTION_NODE_PAGE_SIZE:-32}
      INGESTION_EMBED_BATCH_SIZE: ${INGESTION_EMBED_BATCH_SIZE:-128}
      INGESTION_EMBED_MAX_BYTES: ${INGESTION_EMBED_MAX_BYTES:-262144}
      INGESTION_MAX_ARTIFACT_BYTES: ${INGESTION_MAX_ARTIFACT_BYTES:-1048576}
    healthcheck:
      test: ["CMD", "python3", "-m", "shared.healthcheck", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      # #188: kept as a startup grace margin (apt/system-dep init, disk
      # I/O on a cold host) even after #41's fix baked this service's
      # env into the image at build time instead of resolving it via
      # `uv run --directory` on every container start/recreation.
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ragnet

  vector_store_service:
    build:
      context: .
      dockerfile: vector_store_service/Dockerfile
    container_name: vector-store-service
    ports:
      - "8002:8002"
    volumes:
      - ./vector_store_service:/app/vector_store_service
      - ./shared:/app/shared
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://ingestion_user:ingestion_pass@postgres:5432/ingestion_db
    healthcheck:
      test: ["CMD", "python3", "-m", "shared.healthcheck", "http://127.0.0.1:8002/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s  # #188: see ingestion_service's healthcheck comment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ragnet

  llm_service:
    build:
      context: .
      dockerfile: llm_service/Dockerfile
    container_name: llm-service
    ports:
      - "8003:8000"
    volumes:
      - ./llm_service/src:/app/llm_service/src
      - ./shared:/app/shared
      - ./volumes/llm-runtime:/runtime
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app:/app/llm_service
      MODEL_POLICY_PATH: /runtime/model-policy.json
    healthcheck:
      test: ["CMD", "python3", "-m", "shared.healthcheck", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s  # #188: see ingestion_service's healthcheck comment
    networks:
      - ragnet
    depends_on:
      vector_store_service:
        condition: service_healthy

  rag_orchestrator:
    build:
      context: .
      dockerfile: rag_orchestrator/Dockerfile
    container_name: rag-orchestrator
    ports:
      - "8004:8000"
    volumes:
      - ./rag_orchestrator/src:/app/rag_orchestrator/src
      - ./shared:/app/shared
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app:/app/rag_orchestrator
    healthcheck:
      test: ["CMD", "python3", "-m", "shared.healthcheck", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s  # #188: see ingestion_service's healthcheck comment
    networks:
      - ragnet
    depends_on:
      ingestion_service:
        condition: service_healthy
      vector_store_service:
        condition: service_healthy
      llm_service:
        condition: service_healthy

  ######################
  # 🎨 Optional UI
  ######################
  gradio:
    build:
      context: .
      dockerfile: gradio/Dockerfile
    container_name: gradio-ui
    ports:
      - "7860:7860"
    environment:
      API_BASE_URL: http://ingestion_service:8000
      RAG_API_BASE_URL: http://rag_orchestrator:8000
    healthcheck:
      test: ["CMD", "python3", "-m", "shared.healthcheck", "http://127.0.0.1:7860/", "--html"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s  # #188: see ingestion_service's healthcheck comment
    depends_on:
      - ingestion_service
      - rag_orchestrator
    networks:
      - ragnet
networks:
  ragnet:
    driver: bridge
