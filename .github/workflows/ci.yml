# CI for rag-foundry-universal (audit F-17 / WP-E2 CI slice).
#
# Mirrors the local workflow: one root uv environment (uv.lock) drives
# lint and every service's tests. Known-broken test files are excluded
# with a tracking issue each; remove the exclusion when the issue closes.
name: CI

on:
  push:
    branches: [main, post-audit-branch]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen

      - name: repo packaging tests
        run: uv run pytest tests/ -q

      - name: ingestion_service unit tests
        working-directory: ingestion_service
        run: ../.venv/bin/python -m pytest -m unit -q

      - name: vector_store_service unit tests
        working-directory: vector_store_service
        run: ../.venv/bin/python -m pytest -m unit -q

      - name: llm_service tests
        working-directory: llm_service
        run: ../.venv/bin/python -m pytest tests/ -q

      - name: rag_orchestrator tests
        working-directory: rag_orchestrator
        run: ../.venv/bin/python -m pytest -q

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ingestion_user
          POSTGRES_PASSWORD: ingestion_pass
          POSTGRES_DB: ingestion_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ingestion_user -d ingestion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ingestion_user:ingestion_pass@localhost:5433/ingestion_test
      CI_HAS_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: ingestion_service integration tests (atomic graph persistence)
        working-directory: ingestion_service
        run: ../.venv/bin/python -m pytest tests/codebase/test_atomic_graph_persistence.py -q

      - name: ingestion_service integration tests (bounded artifact paging)
        working-directory: ingestion_service
        run: ../.venv/bin/python -m pytest tests/codebase/test_artifact_paging.py -q -s -k "not fresh_process_memory_scaling"

      - name: vector_store_service integration tests (ANN index usage)
        id: ann-tests
        working-directory: vector_store_service
        run: ../.venv/bin/python -m pytest tests/core/vectorstore/test_ann_index_usage.py -q

      - name: Diagnose post-delete ANN failures with isolated-test vacuum
        if: failure() && steps.ann-tests.outcome == 'failure'
        working-directory: vector_store_service
        run: |
          ../.venv/bin/python -c 'import os, psycopg; c=psycopg.connect(os.environ["DATABASE_URL"], autocommit=True); assert c.info.dbname.endswith("_test"); c.execute("VACUUM (ANALYZE) ingestion_service.vector_chunks"); c.close()'
          ../.venv/bin/python -m pytest tests/core/vectorstore/test_ann_index_usage.py -q

  bounded-memory:
    # Independent DB prevents benchmark churn from contaminating other suites.
    # It does NOT fix the post-delete ANN regression, tracked separately in #176.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ingestion_user
          POSTGRES_PASSWORD: ingestion_pass
          POSTGRES_DB: ingestion_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ingestion_user -d ingestion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ingestion_user:ingestion_pass@localhost:5433/ingestion_test
      CI_HAS_DB: "1"
      MEMORY_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/bounded-memory
      MEMORY_MEASUREMENT_PHASE: acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Fresh-process synthetic memory acceptance
        working-directory: ingestion_service
        run: ../.venv/bin/python -m pytest tests/codebase/test_artifact_paging.py -q -s -k fresh_process_memory_scaling
      - name: Preserve bounded-memory raw samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-memory-evidence
          path: artifacts/bounded-memory/
          if-no-files-found: warn
          retention-days: 14
