# .pre-commit-config.yaml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.3
    hooks:
      - id: ruff

  - repo: local
    hooks:
      - id: pyright
        name: pyright .
        entry: uv run pyright .
        language: system
        types: [python]
        pass_filenames: false
        # Remove additional_dependencies - language: system uses your uv env

      - id: no-tailnet-addresses
        name: no tailnet addresses in code/config (#268)
        entry: python scripts/check_private_addresses.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
